# =====================================================================
# NPC fundraising sample dataset -- recipe 03 of 10
# Person Accounts, generated as Contact shapes (10) and mapped onto Account's Person*-prefixed fields by the transform.
# Feeds transform script(s): 290 (PersonAccount)
#
# Part of sample_data/ -- see sample_data/README.md for the full,
# ordered generate + load sequence. Fully synthetic data (no real
# client data). Runs standalone with `snowfakery run <this file>`, or
# is regenerated from the target org's describe() via the
# generate-related-mock-data command shown in the README.
# =====================================================================
- snowfakery_version: 3
- object: Contact
  count: 10
  fields:
    LastName:
      fake: LastName
    FirstName:
      fake: FirstName
    Salutation:
      random_choice:
      - Mr.
      - Ms.
      - Mrs.
      - Dr.
      - Prof.
      - Mx.
    OtherStreet:
      fake: StreetAddress
    OtherCity:
      fake: City
    OtherState:
      fake: StateAbbr
    OtherPostalCode:
      fake: Postcode
    OtherCountry:
      fake: CountryCode
    OtherGeocodeAccuracy:
      random_choice:
      - Address
      - NearAddress
      - Block
      - Street
      - ExtendedZip
      - Zip
      - Neighborhood
      - City
      - County
      - State
      - Unknown
    MailingStreet:
      fake: StreetAddress
    MailingCity:
      fake: City
    MailingState:
      fake: StateAbbr
    MailingPostalCode:
      fake: Postcode
    MailingCountry:
      fake: CountryCode
    MailingGeocodeAccuracy:
      random_choice:
      - Address
      - NearAddress
      - Block
      - Street
      - ExtendedZip
      - Zip
      - Neighborhood
      - City
      - County
      - State
      - Unknown
    Phone:
      fake: PhoneNumber
    Fax:
      fake: PhoneNumber
    MobilePhone:
      fake: PhoneNumber
    HomePhone:
      fake: PhoneNumber
    OtherPhone:
      fake: PhoneNumber
    AssistantPhone:
      fake: PhoneNumber
    Email:
      fake: Email
    Title:
      fake: Word
    Department:
      fake: Word
    AssistantName:
      fake: Company
    LeadSource:
      random_choice:
      - Advertisement
      - Employee Referral
      - External Referral
      - Partner
      - Public Relations
      - Seminar - Internal
      - Seminar - Partner
      - Trade Show
      - Web
      - Word of mouth
      - Other
    Birthdate:
      fake.DateBetween:
        start_date: -3y
        end_date: +1y
    Description:
      fake: Paragraph
    EmailBouncedReason:
      fake: Email
    EmailBouncedDate:
      fake.DateTimeBetween:
        start_date: -3y
        end_date: +1y
    MaritalStatus:
      random_choice:
      - Married
      - Single
      - Divorced
      - Widowed
      - Separated
    GenderIdentity:
      random_choice:
      - Male
      - Female
      - Nonbinary
      - Not Listed
    ContactSource:
      random_choice:
      - Auto Create
      - Email Message
      - Meeting Digest
      - Seller Home
    TitleType:
      random_choice:
      - ceo
      - executive
      - vp
      - directorOrManager
      - individualContributor
    DepartmentGroup:
      random_choice:
      - chiefExecutive
      - sales
      - finance
      - tech
      - support
      - legal
      - humanResources
      - customerSuccess
      - marketing
      - other
    MigrationID__c:
      fake: Word
