# =====================================================================
# NPC fundraising sample dataset -- recipe 02 of 10
# Organization Accounts (5).
# Feeds transform script(s): 280 (OrganizationAccount)
#
# Part of sample_data/ -- see sample_data/README.md for the full,
# ordered generate + load sequence. Fully synthetic data (no real
# client data). Runs standalone with `snowfakery run <this file>`, or
# is regenerated from the target org's describe() via the
# generate-related-mock-data command shown in the README.
# =====================================================================
- snowfakery_version: 3
- object: Account
  count: 5
  fields:
    Name:
      fake: Company
    LastName:
      fake: LastName
    FirstName:
      fake: FirstName
    Salutation:
      random_choice:
      - Mr.
      - Ms.
      - Mrs.
      - Dr.
      - Prof.
      - Mx.
    Type:
      random_choice:
      - Analyst
      - Competitor
      - Customer
      - Integrator
      - Investor
      - Partner
      - Press
      - Prospect
      - Reseller
      - Other
    BillingStreet:
      fake: StreetAddress
