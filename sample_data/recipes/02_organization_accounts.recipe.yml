      fake: City
    BillingState:
      fake: StateAbbr
    BillingPostalCode:
      fake: Postcode
    BillingCountry:
      fake: CountryCode
    BillingGeocodeAccuracy:
      random_choice:
      - Address
      - NearAddress
      - Block
      - Street
      - ExtendedZip
      - Zip
      - Neighborhood
      - City
      - County
      - State
      - Unknown
