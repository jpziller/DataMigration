      fake.DateBetween:
        start_date: -3y
        end_date: +1y
    LastPaidTransactionDate:
      fake.DateBetween:
        start_date: -3y
        end_date: +1y
    LastYearTransactionCount:
      fake.RandomInt:
        min: 0
        max: 1000
    CurrentYearTransactionCount:
      fake.RandomInt:
        min: 0
        max: 1000
    LastTwoYearTrxnCount:
      fake.RandomInt:
        min: 0
        max: 1000
    TotalTransactionCount:
      fake.RandomInt:
        min: 0
        max: 1000
    LowestTransactionAmount:
      fake.Pyfloat:
        left_digits: 5
        right_digits: 2
        positive: true
    HighestTransactionAmount:
      fake.Pyfloat:
        left_digits: 5
        right_digits: 2
        positive: true
    LastYearTrxnAmount:
      fake.Pyfloat:
        left_digits: 5
        right_digits: 2
        positive: true
    CurrentYearTrxnAmount:
      fake.Pyfloat:
        left_digits: 5
        right_digits: 2
        positive: true
    LastTwoYearTrxnAmount:
      fake.Pyfloat:
        left_digits: 5
        right_digits: 2
        positive: true
    TotalTransactionAmount:
      fake.Pyfloat:
        left_digits: 5
        right_digits: 2
        positive: true
    MigrationID__c:
