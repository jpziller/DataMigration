# =====================================================================
# NPC fundraising sample dataset -- recipe 01 of 10
# Household Accounts (8), each with 1-3 nested Contacts.
# Feeds transform script(s): 230 (HouseholdAccount) + 240 (Contact)
#
# Part of sample_data/ -- see sample_data/README.md for the full,
# ordered generate + load sequence. Fully synthetic data (no real
# client data). Runs standalone with `snowfakery run <this file>`, or
# is regenerated from the target org's describe() via the
# generate-related-mock-data command shown in the README.
# =====================================================================
- snowfakery_version: 3
- object: Account
  count: 8
  fields:
    Name:
      fake: Company
    LastName:
      fake: LastName
    FirstName:
      fake: FirstName
    Salutation:
      random_choice:
      - Mr.
      - Ms.
      - Mrs.
      - Dr.
      - Prof.
      - Mx.
    Type:
      random_choice:
      - Analyst
      - Competitor
      - Customer
      - Integrator
      - Investor
      - Partner
      - Press
      - Prospect
      - Reseller
      - Other
    BillingStreet:
      fake: StreetAddress
    BillingCity:
      fake: City
    BillingState:
      fake: StateAbbr
    BillingPostalCode:
      fake: Postcode
    BillingCountry:
      fake: CountryCode
    BillingGeocodeAccuracy:
      random_choice:
      - Address
      - NearAddress
      - Block
      - Street
      - ExtendedZip
      - Zip
      - Neighborhood
      - City
      - County
      - State
      - Unknown
    ShippingStreet:
      fake: StreetAddress
    ShippingCity:
      fake: City
    ShippingState:
      fake: StateAbbr
    ShippingPostalCode:
      fake: Postcode
